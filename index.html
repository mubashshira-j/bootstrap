<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    


    <div class="container-fluid">
        <div class="row">
            <!-- sidebar open  -->
             <div class="col-md-3 col-lg-2 bg-dark text-white p-3 vh-100">
                <h3>Dashboard</h3>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item">
                        <a href="" class="nav-link text-white">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="" class="nav-link text-white">Users </a>
                    </li>
                    <li class="nav-item">
                        <a href="" class="nav-link text-white">Reports</a>
                    </li>
                    
                </ul>
             </div>
            <!-- side bar close -->

            <!-- main content -->
             <div class="col-md-9 col-lg-10 p-4 ">
                <h2>Welcome Here </h2>
                <div class="alert alert-success">You have 4 new users today ! </div>
                <div class="progress mb-3">
                    <div class="progress-bar" style="width: 65%;" >65%</div>
                </div>

                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Status</th>
                        </tr>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Mubashshira</td>
                                <td span class="badge bg-success">99% Active</td>
                            </tr>
                            
                            <tr>
                                <td>2</td>
                                <td>Mahi</td>
                                <td span class="badge bg-danger">37% Active</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>Hardi</td>
                                <td span class="badge bg-info">69% Active</td>
                            </tr>
                            <tr>
                                <td>4</td>
                                <td>Rishab</td>
                                <td span class="badge bg-success">75% Active</td>
                            </tr>
                        </tbody>
                    </thead>
                </table>
             </div>


            <!-- main content -->






        </div>
    </div>












    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
